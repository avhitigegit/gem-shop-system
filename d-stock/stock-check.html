<!-- Screen: Stock check (scan tags, list missing / wrong place) | BRD: D4, D1, D7 | Roles: Owner, Shop Staff -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Check · Gem Shop</title>
<link rel="icon" href="../assets/img/logo.svg"><link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-root="../" data-page="d-stock/stock-check.html" data-roles="owner staff">
<div id="page"></div>
<script src="../assets/js/data.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/layout.js"></script>
<script>
if (PAGE_ALLOWED) (function () {
  const br = activeBranch();
  const expected = S.products.filter(p => p.branch === br && ['in_stock', 'reserved', 'returned', 'on_hold', 'not_ready'].includes(p.status));
  const scanned = new Set(); const wrong = []; const unknown = [];
  let finished = null;
  $('#page').innerHTML = UI.pageHead({ crumbs: 'D · Stock & branches', title: 'Stock check – ' + esc(branchName(br)), brd: ['D4'], sub: 'Scan every tag in the branch. The system lists any product that is missing or in the wrong place.', actions: '<button class="btn btn-outline" id="simAll">Demo: scan all but 2</button><button class="btn btn-sapphire" id="finish">Finish check</button>' }) +
    `<div class="grid g-2-1"><div class="stack">
      <div class="card"><div class="card-content"><div class="scan-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M11 8v8M15 8v8"/></svg><input class="input input-lg" id="scan" autofocus placeholder="Scan a tag (USB scanner or phone camera)…"></div>
      <div class="row mt-s"><button class="btn btn-outline btn-sm" id="cam">📷 Use phone camera</button><span class="muted" style="font-size:12px">Camera scanning is optional (tech stack §7).</span></div></div></div>
      <div class="card"><div class="card-header"><h3>Progress</h3><span id="prog"></span></div><div class="card-content"><div class="bar"><i id="bar" style="width:0"></i></div><div id="grid" class="mt"></div></div></div>
    </div><div class="stack"><div class="card"><div class="card-header"><h3>Missing</h3></div><div class="card-content" id="missing"></div></div><div class="card"><div class="card-header"><h3>Wrong place / unknown</h3></div><div class="card-content" id="wrong"></div></div>
      <div class="card"><div class="card-header"><h3>Previous checks</h3></div><div class="card-content"><ul class="list">${S.stockChecks.map(c => `<li style="font-size:12px"><div style="flex:1"><b>${c.id}</b> · ${fmt.date(c.date)} · ${esc(user(c.by).name)}<br>${c.found}/${c.expected} found · missing: ${c.missing.join(', ') || 'none'}<br><span class="muted">${esc(c.notes || '')}</span></div></li>`).join('')}</ul></div></div></div></div>`;
  function add(code) {
    code = code.trim().toUpperCase(); if (!code) return;
    const p = prod(code);
    if (!p) { unknown.push(code); toast('Unknown tag', code, 'error'); }
    else if (expected.includes(p)) { if (scanned.has(code)) toast('Already scanned', code, 'warning'); else { scanned.add(code); } }
    else if (!wrong.includes(code)) { wrong.push(code); toast('Wrong place', code + ' should be ' + (p.status === 'sold' ? 'sold' : 'at ' + branchName(p.branch) + ' (' + (STATUS[p.status] || [p.status])[0] + ')'), 'warning'); }
    render();
  }
  function render() {
    const n = scanned.size;
    $('#prog').textContent = n + ' / ' + expected.length;
    $('#bar').style.width = (expected.length ? n / expected.length * 100 : 0) + '%';
    $('#grid').innerHTML = `<div class="prod-grid" style="grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px">${expected.map(p => `<div class="card center" style="padding:6px;${scanned.has(p.id) ? 'border-color:var(--success);background:#f3fbf5' : 'opacity:.6'}">${gemSVG(p.gem, p.type, 40)}<div class="mono" style="font-size:10px">${p.id}</div>${scanned.has(p.id) ? '<span class="badge badge-success">✓</span>' : '<span class="badge badge-default">…</span>'}</div>`).join('')}</div>`;
    const miss = expected.filter(p => !scanned.has(p.id));
    $('#missing').innerHTML = miss.length ? `<ul class="list">${miss.map(p => `<li>${gemSVG(p.gem, p.type, 28)}<div style="flex:1;font-size:12px"><b>${p.id}</b> ${esc(p.name)}</div>${finished ? `<a class="btn btn-sm btn-outline" href="stock-correction.html?id=${p.id}">Report</a>` : ''}</li>`).join('')}</ul>` : '<div class="text-success">Nothing missing ✓</div>';
    $('#wrong').innerHTML = (wrong.map(c => `<div class="badge badge-warning mono" style="margin:2px">${c}</div>`).join('') + unknown.map(c => `<div class="badge badge-danger mono" style="margin:2px">${esc(c)}?</div>`).join('')) || '<span class="muted">None</span>';
  }
  $('#scan').onkeydown = e => { if (e.key === 'Enter') { add(e.target.value); e.target.value = ''; } };
  $('#cam').onclick = () => UI.modal({ title: 'Camera scanner (demo)', body: `<div class="gem-pic" style="height:220px;background:#111;color:#fff;border-radius:12px">📷 Point the camera at a tag…</div>`, actions: [{ label: 'Close', cls: 'btn-outline' }, { label: 'Simulate a scan', cls: 'btn-sapphire', onClick: () => { const p = expected.find(x => !scanned.has(x.id)); if (p) add(p.id); } }] });
  $('#simAll').onclick = () => { expected.slice(0, Math.max(0, expected.length - 2)).forEach(p => scanned.add(p.id)); const sold = S.products.find(p => p.status === 'sold'); if (sold && !wrong.includes(sold.id)) wrong.push(sold.id); render(); toast('Demo scans added', ''); };
  $('#finish').onclick = () => {
    const miss = expected.filter(p => !scanned.has(p.id)).map(p => p.id);
    UI.confirm('Finish stock check?', `${scanned.size} of ${expected.length} found. ${miss.length} missing, ${wrong.length} in the wrong place. The owner receives the result.`, () => {
      const c = { id: nextId('stockCheck', 'SCK-'), date: new Date().toISOString(), branch: br, by: currentUser().id, expected: expected.length, found: scanned.size, missing: miss, wrong: wrong.slice(), resolved: !miss.length, notes: '' };
      S.stockChecks.unshift(c); finished = c;
      Log.add('Stock check finished', c.id + ' · ' + c.found + '/' + c.expected + ' found · missing ' + (miss.join(', ') || 'none'));
      Alerts.add('stock', 'Stock check ' + c.id + ': ' + miss.length + ' missing', 'd-stock/stock-check.html');
      Store.save(); toast('Stock check saved', c.id + (miss.length ? ' – report missing items as stock corrections (D7)' : ' – all found'), miss.length ? 'warning' : 'success'); render();
    }, { yes: 'Finish' });
  };
  render();
})();
</script>
</body>
</html>
