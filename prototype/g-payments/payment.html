<!-- Screen: Payment dialog (stand-alone demo of the POS payment step) | BRD: G1, G2 | Rule: 10 | Roles: Owner, Salesperson -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment Dialog · Gem Shop</title>
<link rel="icon" href="../assets/img/logo.svg"><link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-root="../" data-page="g-payments/payment.html" data-roles="owner salesperson">
<div id="page"></div>
<script src="../assets/js/data.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/layout.js"></script>
<script>
if (PAGE_ALLOWED) (function () {
  $('#page').innerHTML = UI.pageHead({ crumbs: 'G · Payments', title: 'Payment dialog', brd: ['G1', 'G2'], sub: 'The same dialog opens from the POS when a sale is completed. Try it here with any amount – nothing is saved.' }) +
    `<div class="grid g2"><div class="card"><div class="card-content stack">
      <div class="field"><label class="req">Amount to pay (LKR)</label><input class="input input-lg" id="amt" type="number" min="1" value="450000"></div>
      <div id="tri" class="muted"></div>
      <button class="btn btn-lg btn-success" id="open">Open payment dialog</button>
      ${UI.ruleNote(10, 'Prices and payments use LKR, USD and EUR only. USD and EUR cash is converted to LKR at the day\'s rate set by the owner (A4).')}
    </div></div>
    <div class="card"><div class="card-header"><h3>Result</h3></div><div class="card-content" id="res"><div class="muted">Confirm a payment to see what is stored: every amount in LKR, plus the currency, rate and foreign amount actually paid (tech stack §7).</div></div></div></div>`;
  const tri = () => $('#tri').textContent = fmt.tri(Number($('#amt').value) || 0);
  $('#amt').oninput = tri; tri();
  $('#open').onclick = () => {
    const a = Number($('#amt').value); if (!(a > 0)) { toast('Enter an amount', '', 'error'); return; }
    UI.payment(a, r => {
      $('#res').innerHTML = UI.table([{ h: 'Method', f: p => p.method }, { h: 'Currency', f: p => p.currency }, { h: 'Amount', num: 1, f: p => fmt.money(p.amount, p.currency) }, { h: 'Rate', num: 1, f: p => fmt.num(p.rate) }, { h: 'LKR', num: 1, f: p => fmt.lkr(p.lkr) }, { h: 'Bank fee (shop pays)', num: 1, f: p => p.fee ? fmt.lkr(p.fee) : '–' }], r.payments, { foot: ['Change due', '', '', '', '', `<span class="text-gold">${fmt.lkr(r.change)}</span>`] });
      toast('Payment confirmed (demo)', 'Change due ' + fmt.lkr(r.change), 'success');
    });
  };
})();
</script>
</body>
</html>
