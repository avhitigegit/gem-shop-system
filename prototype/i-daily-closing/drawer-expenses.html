<!-- Screen: Drawer expenses & cash commission payouts | BRD: I2, M4, M2, M6 | Rule: 11 | Roles: Owner, Salesperson -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drawer Expenses · Gem Shop</title>
<link rel="icon" href="../assets/img/logo.svg"><link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-root="../" data-page="i-daily-closing/drawer-expenses.html" data-roles="owner salesperson">
<div id="page"></div>
<script src="../assets/js/data.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/layout.js"></script>
<script>
if (PAGE_ALLOWED) (function () {
  const br = activeBranch(), d = todayYmd();
  function render() {
    const ex = S.expenses.filter(e => e.branch === br && ymd(e.date) === d && e.method === 'Cash (drawer)');
    const cm = S.commissions.filter(c => c.method === 'Cash (drawer)' && c.paidAt && ymd(c.paidAt) === d && (c.branch || 'ella') === br);
    $('#page').innerHTML = UI.pageHead({ crumbs: 'I · Daily cash closing', title: 'Drawer expenses – ' + fmt.date(d), brd: ['I2', 'M4'], sub: 'Small shop expenses paid in cash from the drawer. They are taken off the expected cash at day end.' }) +
      `<div class="grid g-1-2"><form class="card" id="f" novalidate><div class="card-header"><h3>Pay from drawer</h3></div><div class="card-content stack" style="gap:12px">
        <div class="field"><label class="req">Expense type</label><select name="category" required>${UI.opts(S.lists.expenseCategories, '', 'Select…')}</select></div>
        <div class="field"><label class="req">Amount (LKR)</label><input class="input" type="number" name="amount" min="1" required></div>
        <div class="field"><label class="req">Paid to</label><input class="input" name="paidTo" required placeholder="e.g. Tea shop, post office"></div>
        <div class="field"><label class="req">Bill photo</label><div class="upload" id="up">⇪ Take / upload bill photo</div><span class="err">Every expense needs a bill photo (rule 11).</span></div>
        <button class="btn btn-sapphire" type="submit">Record drawer expense</button>
        <div class="muted" style="font-size:12px">Expenses above ${fmt.lkr(S.shop.largeExpenseLimit)} need owner approval (M6).</div>
      </div></form>
      <div class="stack"><div class="card"><div class="card-header"><h3>Today's drawer expenses</h3><b>${fmt.lkr(sum(ex, e => e.amount))}</b></div>${UI.table([{ h: 'Time', f: e => fmt.time(e.date) }, { h: 'Expense type', f: e => esc(e.category) }, { h: 'Paid to', f: e => esc(e.paidTo) }, { h: 'Bill', f: e => e.billPhoto ? '📎' : '—' }, { h: 'Amount', num: 1, f: e => fmt.lkr(e.amount) }, { h: 'Status', f: e => badge(e.status) }], ex, { empty: 'No drawer expenses today.' })}</div>
      <div class="card"><div class="card-header"><h3>Commissions paid in cash from the drawer</h3><b>${fmt.lkr(sum(cm, c => c.amount))}</b></div>${UI.table([{ h: 'Payee', f: c => esc(Commissions.payeeName(c)) }, { h: 'Invoice', f: c => c.saleId }, { h: 'Amount', num: 1, f: c => fmt.lkr(c.amount) }], cm, { empty: 'None today.' })}
        <div class="card-content muted" style="font-size:13px">To pay a guide or driver, use <a href="../h-commissions/commissions-payable.html">Pay guides &amp; drivers</a> and choose <b>Cash (drawer)</b>. It shows here and comes off the expected cash.</div></div></div></div>`;
    const F = $('#f'); UI.bindUpload($('#up'));
    F.onsubmit = e => {
      e.preventDefault(); let ok = UI.validate(F);
      if (!$('#up').dataset.file) { $('#up').closest('.field').classList.add('invalid'); if (ok) toast('Bill photo required', 'Rule 11', 'error'); ok = false; }
      if (!ok) return;
      const amt = +F.amount.value; const big = amt > S.shop.largeExpenseLimit;
      const x = { id: nextId('expense', 'EXP-'), date: new Date().toISOString(), branch: br, category: F.category.value, amount: amt, vat: 0, paidTo: F.paidTo.value, method: 'Cash (drawer)', billPhoto: $('#up').dataset.file, status: big ? 'pending' : 'approved', by: currentUser().id, note: '', recurringId: null };
      S.expenses.push(x);
      if (big) { const a = Approvals.request({ type: 'expense', title: 'Large expense: ' + x.category + ' ' + fmt.lkr(amt), detail: 'Paid to ' + x.paidTo + ' from the drawer (limit ' + fmt.lkr(S.shop.largeExpenseLimit) + ')', amount: amt, payload: { expenseId: x.id } }); x.approvalId = a.id; }
      Log.add('Drawer expense', x.category + ' · ' + fmt.lkr(amt)); Store.save();
      toast(big ? 'Sent for owner approval' : 'Drawer expense recorded', fmt.lkr(amt), big ? 'warning' : 'success'); render();
    };
  }
  render();
})();
</script>
</body>
</html>
