<!-- Screen: Sitemap – every screen grouped by module, with BRD IDs and a coverage check of all 81 features (A1–N6) | BRD: all | Roles: All -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sitemap · Gem Shop Prototype</title>
<link rel="icon" href="assets/img/logo.svg"><link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-root="" data-brd="always" data-page="index.html" data-roles="owner salesperson staff accountant">
<div id="page"></div>
<script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script src="assets/js/layout.js"></script>
<script>
(function () {
  const O = 'Owner', SP = 'Salesperson', ST = 'Shop Staff', AC = 'Accountant';
  const MAP = [
    ['Global', 'Login, setup & landing', [
      ['auth/login.html', 'Login', 'A2 NFR-2', 'All'], ['auth/signup.html', 'Signup – owner account setup', 'A1 A2 A3 A4', O], ['auth/forgot-password.html', 'Forgot password (reset by email)', 'NFR-2', 'All'],
      ['dashboard/index.html', 'Dashboard (landing page)', 'K1 D6 I1 A1', [O, SP, ST].join(', ')]]],
    ['Global', 'Section home pages (one per menu item)', [
      ['hub/sell.html', 'Sell – home', 'F1 F7 E1 G6', [O, SP, AC].join(', ')], ['hub/stock.html', 'Gems & stock – home', 'B2 C1 D1 D3', [O, SP, ST, AC].join(', ')],
      ['hub/people.html', 'Customers & guides – home', 'J1 H1 H4', [O, SP, AC].join(', ')], ['hub/money.html', 'Cash & expenses – home', 'I1 I3 M2', [O, SP, AC].join(', ')],
      ['hub/reports.html', 'Reports – home', 'L1 N3 N6', O + ', ' + AC], ['hub/settings.html', 'Settings – home', 'A3 A4', O]]],
    ['A', 'Basic Setup', [
      ['a-setup/branches.html', 'Branches', 'A1', O], ['a-setup/users.html', 'Users & roles', 'A2', O], ['a-setup/shop-vat.html', 'Shop & NGJA licence', 'A3', O],
      ['a-setup/currencies.html', 'Currencies & exchange rates', 'A4', O], ['a-setup/lists.html', 'Drop-down lists', 'A5 C2 C3', O], ['a-setup/commission-rules.html', 'Commission rules', 'A6 H1 H2', O]]],
    ['B', 'Suppliers & Purchasing', [
      ['b-purchasing/suppliers.html', 'Supplier list', 'B1', O + ', ' + AC], ['b-purchasing/supplier-detail.html', 'Supplier detail', 'B1 B3', O + ', ' + AC], ['b-purchasing/new-purchase.html', 'New cash purchase (bill photo)', 'B2 B3', O],
      ['b-purchasing/purchase-history.html', 'Purchase history', 'B3', O + ', ' + AC], ['b-purchasing/supplier-returns.html', 'Return to supplier', 'B4', O]]],
    ['C', 'Gem Products & Certificates', [
      ['c-products/products.html', 'Product list (photo grid / table)', 'C1 C2 C3 C5 D1', [O, SP, ST].join(', ')], ['c-products/product-form.html', 'Add / edit product', 'C1 C2 C3 C4 C5 C6 C7 C8 C9', O],
      ['c-products/product-detail.html', 'Product detail', 'C4 C5 C6 C8 D2', [O, SP, ST].join(', ')], ['c-products/tag-print.html', 'QR / barcode tag print', 'C1', O + ', ' + ST], ['c-products/shop-certificate.html', 'Shop certificate print', 'C10', O + ', ' + SP]]],
    ['D', 'Stock & Branches', [
      ['d-stock/transfers.html', 'Branch transfer (send & receive)', 'D3', O + ', ' + ST], ['d-stock/stock-check.html', 'Stock check (scan tags)', 'D4', O + ', ' + ST],
      ['d-stock/product-history.html', 'Product history timeline', 'D5', O + ', ' + ST], ['d-stock/stock-value.html', 'Stock value', 'D6', O], ['d-stock/stock-correction.html', 'Stock correction (reason + approval)', 'D7', O + ', ' + ST]]],
    ['E', 'Returns', [['e-returns/new-return.html', 'Customer brings a gem back (step-by-step)', 'E1 E2', O + ', ' + SP], ['e-returns/returns.html', 'Returns & exchanges list', 'E1 E2', O + ', ' + SP], ['e-returns/credit-note.html', 'Credit notes (print)', 'E2', [O, SP, AC].join(', ')]]],
    ['F', 'Sales Screen (POS)', [['f-pos/pos.html', 'New sale (POS)', 'F1 F2 F3 F4 F5 F6 G1 G2', O + ', ' + SP], ['f-pos/reservations.html', 'Reservations & quotations', 'F7', O + ', ' + SP], ['f-pos/quotation-print.html', 'Quotation print preview', 'F7', O + ', ' + SP]]],
    ['G', 'Payments & Invoice', [['g-payments/payment.html', 'Payment dialog (cash LKR/USD/EUR, card, split)', 'G1 G2', O + ', ' + SP], ['g-payments/invoice.html', 'Invoice + send (email / WhatsApp)', 'G3 G4 G5', [O, SP, AC].join(', ')], ['g-payments/invoices.html', 'Invoice list & cancellation', 'G6', [O, SP, AC].join(', ')]]],
    ['H', 'Commissions', [['h-commissions/guides.html', 'Guides & drivers', 'H1', [O, SP, AC].join(', ')], ['h-commissions/guide-profile.html', 'Guide / driver profile', 'H1 H5', [O, SP, AC].join(', ')], ['h-commissions/commission-breakdown.html', 'Commission breakdown per sale', 'H2 H3', O + ', ' + AC], ['h-commissions/commissions-payable.html', 'Commissions payable & payments', 'H4', O + ', ' + AC], ['h-commissions/commission-slip.html', 'Commission slip print', 'H4', O + ', ' + AC]]],
    ['I', 'Daily Cash Closing', [['i-daily-closing/opening-cash.html', 'Opening cash per currency', 'I1', O + ', ' + SP], ['i-daily-closing/drawer-expenses.html', 'Drawer expenses & cash commissions', 'I2 M4', O + ', ' + SP], ['i-daily-closing/day-end.html', 'Day-end closing (difference highlighted)', 'I3 I4', O + ', ' + SP]]],
    ['J', 'Customers & Promotions', [['j-customers-promotions/customers.html', 'Customer list', 'J1 J2 J8', O + ', ' + SP], ['j-customers-promotions/customer-profile.html', 'Customer profile', 'J1 J2 J5 J8', O + ', ' + SP], ['j-customers-promotions/email-campaign.html', 'Email campaign builder', 'J3', O], ['j-customers-promotions/whatsapp-campaign.html', 'WhatsApp campaign builder', 'J4', O], ['j-customers-promotions/campaign-report.html', 'Campaign report', 'J6', O], ['j-customers-promotions/message-settings.html', 'Message settings (SMTP, WhatsApp Premium, birthday wishes)', 'J5 J7 J8', O]]],
    ['K', 'Owner Control', [['k-owner-control/owner-mobile.html', 'Owner mobile dashboard', 'K1', O], ['k-owner-control/approvals.html', 'Approvals inbox', 'K3 F3 E1 G6 D7 M6 N6', 'All (Owner decides)'], ['k-owner-control/alerts.html', 'Alerts feed', 'K2', O], ['k-owner-control/activity-log.html', 'Activity log (cannot be deleted)', 'K4', O]]],
    ['L', 'Reports', [['l-reports/sales.html', 'Sales report', 'L1 L6', O + ', ' + AC], ['l-reports/profit.html', 'Profit report', 'L2 L6', O + ', ' + AC], ['l-reports/stock.html', 'Stock report & slow-moving', 'L3 L6', O], ['l-reports/commissions.html', 'Commission report', 'L5 H5 L6', O + ', ' + AC], ['l-reports/purchases.html', 'Purchases by supplier', 'L5 L6', O + ', ' + AC], ['l-reports/daily-closing.html', 'Daily closing report', 'L5 I4 L6', O + ', ' + AC]]],
    ['M', 'Shop Expenses', [['m-expenses/expenses.html', 'Expense list', 'M2 M3 M4', O + ', ' + AC], ['m-expenses/add-expense.html', 'Add / correct expense', 'M2 M3 M6', O + ', ' + AC], ['m-expenses/recurring.html', 'Repeating expenses', 'M5', O + ', ' + AC], ['m-expenses/expense-report.html', 'Expense report', 'M7', O + ', ' + AC]]],
    ['N', 'Accountant Access & Tax Reports', [['n-accountant/dashboard.html', 'Accountant dashboard', 'N1 N2', AC + ', ' + O], ['n-accountant/profit-loss.html', 'Profit & Loss', 'N4', AC + ', ' + O], ['n-accountant/tax-pack.html', 'Tax pack download', 'N5', AC + ', ' + O], ['n-accountant/month-closing.html', 'Month closing (locked months)', 'N6', AC + ', ' + O]]]
  ];
  const COUNTS = { A: 6, B: 4, C: 10, D: 7, E: 2, F: 7, G: 6, H: 5, I: 4, J: 8, K: 4, L: 6, M: 7, N: 6 };
  const ids = []; Object.keys(COUNTS).forEach(m => { for (let i = 1; i <= COUNTS[m]; i++) ids.push(m + i); });
  const cov = {}; MAP.forEach(sec => sec[2].forEach(s => s[2].split(' ').forEach(id => { (cov[id] = cov[id] || []).push(s[0]); })));
  const covered = ids.filter(id => cov[id]);
  const RULES = [['1', 'Only the owner adds products, sets prices, sees cost', 'c-products/product-form.html'], ['2', 'No sale below minimum without owner approval', 'f-pos/pos.html'], ['3', 'Sold item cannot be sold again unless returned', 'f-pos/pos.html'], ['4', 'Running invoice numbers; invoices never deleted', 'g-payments/invoices.html'], ['5', 'Commission per sale: guide % + staff slab', 'h-commissions/commission-breakdown.html'], ['6', 'Sapphires → lab certificate; others → shop certificate', 'c-products/product-form.html'], ['7', 'Returns, cancellations, stock corrections need approval', 'k-owner-control/approvals.html'], ['8', 'Promotions only with consent', 'j-customers-promotions/email-campaign.html'], ['9', 'Each branch has own stock & cash; owner sees all', 'dashboard/index.html'], ['10', 'LKR, USD and EUR only', 'a-setup/currencies.html'], ['11', 'Every expense has an expense type & bill photo; closed months locked', 'n-accountant/month-closing.html']];
  $('#page').innerHTML = UI.pageHead({ crumbs: 'Prototype', title: 'Sitemap – all screens', sub: 'Gem Shop Sales &amp; Inventory Management System · clickable prototype for client demo and UI sign-off · BRD v1.0 (10/11/2026). Dummy data only.', actions: '<a class="btn btn-sapphire" href="auth/login.html">Start the demo → Login</a><button class="btn btn-outline" id="reset">↺ Normal reset</button> <button class="btn btn-outline" id="resetSys" style="color:#b91c1c">⌫ Reset system</button>' }) +
    `<div class="grid g4 mb">${UI.kpi('Screens', MAP.reduce((a, s) => a + s[2].length, 0), 'HTML pages')}${UI.kpi('BRD features covered', covered.length + ' / ' + ids.length, covered.length === ids.length ? '✓ all of A1–N6' : 'missing: ' + ids.filter(id => !cov[id]).join(', '), 'accent')}${UI.kpi('Business rules shown', '11 / 11', 'section 05')}${UI.kpi('Demo role', ROLES[P.role], 'switch in the top bar')}</div>
    <div class="card mb"><div class="card-header"><h3>Suggested demo script</h3></div><div class="card-content" style="padding-bottom:0"><div class="alert info">The app uses a simple menu of 8 items (Home, Sell, Gems &amp; stock, Customers &amp; guides, Cash &amp; expenses, Reports, Approvals, Settings). Each item opens a <b>section home</b> with big task buttons, look-up cards and what needs attention; every screen then opens on its own page with a <b>← back</b> link. Work done in order (the cash day, new stock, month end, a sale, a return) shows numbered steps. BRD codes are hidden in the app; turn them on from the user menu → <b>Show BRD notes</b>.</div></div><div class="card-content"><ol style="margin:0;padding-left:18px;line-height:1.9">
      <li>Switch the DEMO ROLE to <b>Salesperson</b> → press <b>+ New sale</b> (<a href="f-pos/pos.html">Sell</a>), scan <span class="mono">GEM-00125</span>, type an agreed price of <b>360000</b> (below the minimum LKR 380,000), add a customer and press <b>Send for owner approval</b>.</li>
      <li>Switch to <b>Owner</b> → the bell shows the request → <b>Approvals</b> in the menu (<a href="k-owner-control/approvals.html">open</a>) → <b>Approve</b> (also works on <a href="k-owner-control/owner-mobile.html">phone view</a>).</li>
      <li>Switch back to <b>Salesperson</b> → the sale screen shows “Approved” → take a split payment (USD cash + card) → print / send the <b>invoice</b>.</li>
      <li>Try to scan the same product again → blocked (rule 3). Check <a href="h-commissions/commission-breakdown.html">commissions</a> and <a href="i-daily-closing/day-end.html">Cash &amp; expenses → Close the day</a>.</li>
      <li>Switch to <b>Accountant</b> → the menu shows only money and reports; try <a href="n-accountant/month-closing.html">month closing</a> and the <a href="n-accountant/tax-pack.html">tax pack</a>.</li></ol></div></div>
    <div class="grid g2">${MAP.map(sec => `<div class="card"><div class="card-header"><h3>${sec[0].length === 1 ? `<span class="brd" style="font-size:12px">${sec[0]}</span> ` : ''}${esc(sec[1])}</h3><span class="muted" style="font-size:12px">${sec[2].length} screen(s)</span></div><ul class="list" style="padding:0 18px">${sec[2].map(s => `<li style="align-items:flex-start"><div style="flex:1"><a href="${s[0]}"><b>${esc(s[1])}</b></a><br><small class="muted mono">${s[0]}</small><br><small class="muted">Roles: ${esc(s[3])}</small></div><div class="row" style="gap:3px;justify-content:flex-end;max-width:45%">${s[2].split(' ').map(b => `<span class="brd">${b}</span>`).join('')}</div></li>`).join('')}</ul></div>`).join('')}</div>
    <div class="card mt"><div class="card-header"><h3>Business rules (BRD section 05) – where they show</h3></div>${UI.table([{ h: '#', f: r => r[0] }, { h: 'Rule', f: r => esc(r[1]) }, { h: 'See it on', f: r => `<a href="${r[2]}">${r[2]}</a>` }], RULES)}</div>
    <div class="card mt"><div class="card-header"><h3>Coverage – BRD requirement → screen</h3>${UI.exportButtons('#covT', 'BRD coverage')}</div>${UI.table([{ h: 'BRD ID', f: id => `<span class="brd">${id}</span>` }, { h: 'Screen(s)', f: id => cov[id] ? [...new Set(cov[id])].map(p => `<a href="${p}" class="mono" style="font-size:12px">${p}</a>`).join('<br>') : '<span class="badge badge-danger">not covered</span>' }, { h: '', f: id => cov[id] ? '<span class="text-success">✓</span>' : '✗' }], ids, { id: 'covT' })}</div>`;
  $('#reset').onclick = DemoReset.normal;
  const rs = $('#resetSys'); if (rs) rs.onclick = DemoReset.system;
})();
</script>
</body>
</html>
