<!-- Screen: Forgot password – reset by email | BRD: NFR-2 | Tech stack §6.1 (password reset via the shop's SMTP) | Roles: All (public) -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password · Gem Shop</title>
<link rel="icon" href="../assets/img/logo.svg"><link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-root="../" data-layout="none">
<div class="auth-main" style="min-height:100vh"><div class="auth-card">
  <div class="center mb"><img src="../assets/img/logo.svg" width="48" alt=""></div>
  <div class="card"><div class="card-content" style="padding:28px" id="box"></div></div>
  <p class="center mt-s"><a href="login.html">← Back to sign in</a></p>
</div></div>
<script src="../assets/js/data.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/layout.js"></script>
<script>
(function () {
  let sentTo = '';
  function step1() {
    $('#box').innerHTML = `<h2 style="font-size:20px">Forgot your password?</h2><p class="muted">Enter your login email. We'll send a reset link from the shop's email (SMTP).</p>
      <form id="f" novalidate class="stack mt" style="gap:12px"><div class="field"><label class="req">Email</label><input class="input" type="email" name="email" required placeholder="you@ceylongemhouse.lk"></div><button class="btn btn-sapphire btn-block btn-lg" type="submit">Send reset link</button></form>`;
    $('#f').onsubmit = e => { e.preventDefault(); if (!UI.validate(e.target)) return; sentTo = e.target.email.value; step2(); };
  }
  function step2() {
    $('#box').innerHTML = `<div class="center"><div style="font-size:42px">✉️</div><h2 style="font-size:20px">Check your email</h2><p class="muted">If <b>${esc(sentTo)}</b> has an account, a reset link was sent. The link works for 30 minutes and only once.</p></div>
      <div class="card mt" style="background:var(--muted)"><div class="card-content" style="font-size:12px"><b>Demo email preview</b><br>From: ${esc(S.messaging.smtp.from)}<br>Subject: Reset your password<br><br>Click the link below to choose a new password:<br><a href="#" id="link">https://app.ceylongemhouse.lk/reset?token=8f3a…</a></div></div>
      <button class="btn btn-outline btn-block mt" id="resend">Resend email</button>`;
    $('#link').onclick = e => { e.preventDefault(); step3(); };
    $('#resend').onclick = () => toast('Email sent again', sentTo, 'success');
  }
  function step3() {
    $('#box').innerHTML = `<h2 style="font-size:20px">Choose a new password</h2><form id="f" novalidate class="stack mt" style="gap:12px">
      <div class="field"><label class="req">New password</label><input class="input" type="password" name="pw" required><span class="hint">At least 8 characters, including a number</span></div>
      <div class="field"><label class="req">Confirm new password</label><input class="input" type="password" name="pw2" required></div>
      <button class="btn btn-sapphire btn-block btn-lg" type="submit">Save new password</button></form>`;
    $('#f').onsubmit = e => {
      e.preventDefault(); const f = e.target; if (!UI.validate(f)) return;
      if (f.pw.value.length < 8 || !/\d/.test(f.pw.value)) { f.pw.closest('.field').classList.add('invalid'); toast('Password too weak', '', 'error'); return; }
      if (f.pw.value !== f.pw2.value) { f.pw2.closest('.field').classList.add('invalid'); toast('Passwords do not match', '', 'error'); return; }
      $('#box').innerHTML = `<div class="center"><div style="font-size:42px">✅</div><h2 style="font-size:20px">Password changed</h2><p class="muted">You can sign in with your new password. Other devices were signed out.</p><a class="btn btn-sapphire btn-block mt" href="login.html">Sign in</a></div>`;
    };
  }
  step1();
})();
</script>
</body>
</html>
