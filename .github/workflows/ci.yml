# CI checks – run on every pull request (and on every merge into dev / uat / main).
# A pull request can only be merged when all three jobs are green (branch protection on dev and main).
name: CI

on:
  pull_request:
    branches: [dev, uat, main]
  push:
    branches: [dev, uat, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend – build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Tests use a real PostgreSQL through Testcontainers (Docker is available on the runner).
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Test report
        if: always()
        run: |
          {
            echo "### Backend tests"
            for f in target/surefire-reports/*.txt; do [ -f "$f" ] && grep "Tests run" "$f"; done
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend – lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Format check
        run: npm run format:check
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker images – build only
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: [server, client]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Checked only – images are not pushed or deployed yet (that comes with the UAT server, P6-02).
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          push: false
          tags: gemshop-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  compose:
    name: Docker Compose – config check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose.yaml and Nginx config
        run: |
          docker compose config --quiet
          docker run --rm \
            --add-host server:127.0.0.1 --add-host client:127.0.0.1 \
            -v "$PWD/infra/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t
