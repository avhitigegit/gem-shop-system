<!-- Screen: Currencies & exchange rates (LKR, USD, EUR only) | BRD: A4, G2 | Rule: 10 | NFR-8 | Roles: Owner -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Currencies &amp; Rates · Gem Shop</title>
<link rel="icon" href="../assets/img/logo.svg"><link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-root="../" data-page="a-setup/currencies.html" data-roles="owner">
<div id="page"></div>
<script src="../assets/js/data.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/layout.js"></script>
<script>
if (PAGE_ALLOWED) (function () {
  function render() {
    const h = S.rateHistory.slice().reverse();
    $('#page').innerHTML = UI.pageHead({ crumbs: 'A · Basic setup', title: 'Currencies & exchange rates', brd: ['A4'], sub: 'Three currencies only: LKR, US Dollar and Euro. The owner updates the USD and EUR rates; USD/EUR cash is converted to LKR at the day\'s rate.' }) +
      `<div class="mb">${UI.ruleNote(10, 'Prices and payments use LKR, USD and EUR only. Other currencies cannot be added.')}</div>
      <div class="grid g-1-2"><form class="card" id="f" novalidate><div class="card-header"><h3>Today's rates</h3><small class="muted">Updated ${fmt.dt(S.rates.updatedAt)} by ${esc(user(S.rates.by).name)}</small></div><div class="card-content stack" style="gap:14px">
        <div class="row between" style="flex-wrap:nowrap"><div><b>🇱🇰 LKR</b><br><small class="muted">Sri Lankan Rupee – base currency</small></div><span class="badge badge-navy">1.00</span></div>
        <div class="field"><label class="req">🇺🇸 1 USD = LKR</label><input class="input input-lg" type="number" step="0.01" min="1" name="USD" required value="${S.rates.USD}"></div>
        <div class="field"><label class="req">🇪🇺 1 EUR = LKR</label><input class="input input-lg" type="number" step="0.01" min="1" name="EUR" required value="${S.rates.EUR}"></div>
        <div id="ex" class="alert info"></div>
      </div><div class="card-footer"><button class="btn btn-sapphire" type="submit">Save today's rates</button></div></form>
      <div class="card"><div class="card-header"><h3>Rate history</h3></div>${UI.table([{ h: 'Date', f: r => fmt.date(r.date) }, { h: 'USD', num: 1, f: r => fmt.num(r.USD) }, { h: 'EUR', num: 1, f: r => fmt.num(r.EUR) }, { h: 'By', f: r => esc(user(r.by).name) }], h)}</div></div>`;
    const F = $('#f');
    const ex = () => { $('#ex').innerHTML = `Example: the BRD ring at <b>LKR 450,000.00</b> shows as <b>USD ${fmt.num(450000 / (+F.USD.value || 1))}</b> and <b>EUR ${fmt.num(450000 / (+F.EUR.value || 1))}</b>.`; };
    F.addEventListener('input', ex); ex();
    F.onsubmit = e => {
      e.preventDefault(); if (!UI.validate(F)) return;
      S.rates = { USD: +F.USD.value, EUR: +F.EUR.value, updatedAt: new Date().toISOString(), by: currentUser().id };
      const t = todayYmd(); const ex2 = S.rateHistory.find(r => r.date === t);
      if (ex2) Object.assign(ex2, { USD: S.rates.USD, EUR: S.rates.EUR, by: S.rates.by }); else S.rateHistory.push({ date: t, USD: S.rates.USD, EUR: S.rates.EUR, by: S.rates.by });
      Log.add('Exchange rates updated', 'USD ' + fmt.num(S.rates.USD) + ' · EUR ' + fmt.num(S.rates.EUR), 'all'); Store.save();
      toast('Rates saved', 'Used for all new sales and conversions from now on.', 'success'); render();
    };
  }
  render();
})();
</script>
</body>
</html>
