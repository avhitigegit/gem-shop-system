<!-- Screen: Month closing (locked months) | BRD: N6, K3 | Rule: 11 | Roles: Accountant, Owner -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Month Closing · Gem Shop</title>
<link rel="icon" href="../assets/img/logo.svg"><link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-root="../" data-page="n-accountant/month-closing.html" data-roles="accountant owner">
<div id="page"></div>
<script src="../assets/js/data.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/layout.js"></script>
<script>
if (PAGE_ALLOWED) (function () {
  const curMk = monthKey(todayYmd());
  function render() {
    const months = Fin.months();
    $('#page').innerHTML = UI.pageHead({ crumbs: 'N · Accountant & tax', title: 'Month closing', brd: ['N6'], sub: 'A closed month cannot be changed without owner approval. Sales, expenses, purchases and payments dated in a closed month are locked.' }) +
      `<div class="mb">${UI.ruleNote(11, 'Closed months cannot be changed without owner approval.')}</div>
      <div class="stack">${months.map(mk => { const m = Fin.month(mk); const st = S.months[mk]; const locked = st && st.status === 'closed'; const pendingReopen = S.approvals.find(a => a.type === 'month_reopen' && a.status === 'pending' && a.payload.month === mk);
        const checks = [['All expenses have bill photos', !S.expenses.some(e => monthKey(e.date) === mk && !e.billPhoto)], ['No expenses waiting for approval', !S.expenses.some(e => monthKey(e.date) === mk && e.status === 'pending')], ['No invoice cancellations pending', !S.approvals.some(a => a.type === 'cancel_invoice' && a.status === 'pending' && monthKey(sale(a.payload.saleId).date) === mk)], ['Month has ended', mk < curMk]];
        return `<div class="card ${locked ? 'locked-banner' : ''}"><div class="card-header"><div><h2>${locked ? '🔒 ' : ''}${fmt.month(mk)}</h2><p>${m.invoices} invoices · sales ${fmt.cur(m.salesNet)} · VAT to pay ${fmt.cur(m.vatToPay)} · net profit ${fmt.cur(m.net)}</p></div>${badge(locked ? 'closed' : 'open', locked ? 'Closed ' + fmt.date(st.closedAt) + ' by ' + user(st.by).name : (st && st.reopenedAt ? 'Re-opened ' + fmt.date(st.reopenedAt) : 'Open'))}</div>
          <div class="card-content row" style="align-items:flex-start;justify-content:space-between"><ul class="list" style="font-size:12px;min-width:260px">${checks.map(c => `<li style="padding:4px 0">${c[1] ? '<span class="text-success">✓</span>' : '<span class="text-warning">!</span>'} ${c[0]}</li>`).join('')}</ul>
          <div class="row">${locked ? (pendingReopen ? '<span class="badge badge-warning">Re-open request waiting for owner</span>' : `<button class="btn btn-outline" data-reopen="${mk}">${isRole('owner') ? 'Re-open month' : 'Request re-open (owner approval)'}</button>`) : `<button class="btn btn-sapphire" data-close="${mk}" ${mk >= curMk ? 'disabled title="The month has not ended yet"' : ''}>Close month</button>`}</div></div></div>`; }).join('')}</div>`;
  }
  $('#page').addEventListener('click', e => {
    const c = e.target.dataset.close, r = e.target.dataset.reopen;
    if (c) UI.confirm('Close ' + fmt.month(c) + '?', 'Nothing dated in this month can be added or changed afterwards without the owner\'s approval. Make sure the VAT return is filed.', () => { S.months[c] = { status: 'closed', closedAt: new Date().toISOString(), by: currentUser().id }; Log.add('Month closed', fmt.month(c), 'all'); Store.save(); toast(fmt.month(c) + ' closed', 'The month is now locked.', 'success'); render(); }, { yes: 'Close month' });
    if (r) {
      if (isRole('owner')) { UI.reason('Re-open ' + fmt.month(r), 'The owner can re-open a closed month. The reason is kept in the activity log.', reason => { S.months[r] = { status: 'open', reopenedAt: new Date().toISOString(), by: currentUser().id, reason }; Log.add('Month re-opened', fmt.month(r) + ' · ' + reason, 'all'); Store.save(); toast('Month re-opened', fmt.month(r), 'warning'); render(); }, { yes: 'Re-open' }); }
      else UI.reason('Request to re-open ' + fmt.month(r), 'The owner must approve before anything in a closed month can change (N6).', reason => { Approvals.request({ type: 'month_reopen', title: 'Re-open closed month ' + fmt.month(r), detail: reason, payload: { month: r }, branch: 'all' }); toast('Sent for owner approval', '', 'warning'); window.renderBell && renderBell(); render(); });
    }
  });
  render();
})();
</script>
</body>
</html>
