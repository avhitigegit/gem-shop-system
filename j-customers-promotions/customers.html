<!-- Screen: Customer list | BRD: J1, J2, F5 | Rule: 8 | Roles: Owner, Salesperson -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customers · Gem Shop</title>
<link rel="icon" href="../assets/img/logo.svg"><link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-root="../" data-page="j-customers-promotions/customers.html" data-roles="owner salesperson">
<div id="page"></div>
<script src="../assets/js/data.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/layout.js"></script>
<script>
if (PAGE_ALLOWED) (function () {
  const f = { q: '', country: '', consent: '' };
  const countries = [...new Set(S.customers.map(c => c.country))].sort();
  const spent = c => sum(S.sales.filter(s => s.customerId === c.id && s.status !== 'cancelled'), s => s.total);
  $('#page').innerHTML = UI.pageHead({ crumbs: 'J · Customers & promotions', title: 'Customers', brd: ['J1', 'J2'], sub: 'Most buyers are tourists. Contact details are private (PDPA No. 9 of 2022) and promotions go only to customers who gave permission.', actions: '<button class="btn btn-sapphire" id="add">+ Add customer</button>' + `<span data-roles="owner">${UI.exportButtons('#cuT', 'Customers')}</span>` }) +
    `<div class="grid g4 mb">${UI.kpi('Customers', S.customers.length, countries.length + ' countries')}${UI.kpi('Consent to promotions', S.customers.filter(c => c.consent && !c.unsubscribed).length, 'can receive campaigns (rule 8)')}${UI.kpi('Repeat buyers', S.customers.filter(c => S.sales.filter(s => s.customerId === c.id).length > 1).length, 'bought more than once')}${UI.kpi('Top country', Object.entries(groupBy(S.customers, c => c.country)).sort((a, b) => b[1].length - a[1].length).map(x => x[0])[0] || '—', '')}</div>
    <div class="card"><div class="card-content filters"><div class="field" style="flex:1"><label>Search</label><input class="input" id="q" placeholder="Name, email, phone…"></div><div class="field"><label>Country</label><select id="co">${UI.opts(countries, '', 'All countries')}</select></div><div class="field"><label>Promotions</label><select id="cs">${UI.opts([{ v: '', l: 'All' }, { v: 'yes', l: 'Consent given' }, { v: 'no', l: 'No consent / unsubscribed' }])}</select></div></div><div id="list"></div></div>`;
  function render() {
    const q = f.q.toLowerCase();
    const rows = S.customers.filter(c => (!f.country || c.country === f.country) && (!f.consent || (f.consent === 'yes') === (c.consent && !c.unsubscribed)) && (!q || (c.name + c.email + c.whatsapp).toLowerCase().includes(q)));
    $('#list').innerHTML = UI.table([
      { h: 'Customer', f: c => `<a href="customer-profile.html?id=${c.id}"><b>${esc(c.name)}</b></a><br><small class="muted">${c.id}</small>` },
      { h: 'Country', f: c => esc(c.country) }, { h: 'Email', f: c => esc(c.email) }, { h: 'WhatsApp', f: c => esc(c.whatsapp) },
      { h: 'Purchases', num: 1, f: c => S.sales.filter(s => s.customerId === c.id).length },
      { h: 'Spent', num: 1, f: c => fmt.cur(spent(c)) },
      { h: 'Promotions (J2)', f: c => c.unsubscribed ? '<span class="badge badge-danger">Unsubscribed</span>' : c.consent ? '<span class="badge badge-success">✓ Consent ' + fmt.date(c.consentAt) + '</span>' : '<span class="badge badge-default">No consent</span>' }
    ], rows, { id: 'cuT', cls: 'stack-sm' });
  }
  $('#q').oninput = e => { f.q = e.target.value; render(); };
  $('#co').onchange = e => { f.country = e.target.value; render(); };
  $('#cs').onchange = e => { f.consent = e.target.value; render(); };
  $('#add').onclick = () => UI.modal({ title: 'Add customer', body: `<form class="form-grid" novalidate><div class="field full"><label class="req">Name</label><input class="input" name="name" required></div><div class="field"><label class="req">Country</label><select name="country" required>${UI.opts(countries.concat(['Italy', 'Spain', 'Switzerland', 'Other']), '', 'Select…')}</select></div><div class="field"><label>Passport no.</label><input class="input" name="passport" placeholder="stored encrypted"></div><div class="field"><label>Email</label><input class="input" type="email" name="email"></div><div class="field"><label>WhatsApp</label><input class="input" name="whatsapp"></div><label class="check full"><input type="checkbox" name="consent"> Customer agrees to receive promotions by email / WhatsApp</label></form>`,
    actions: [{ label: 'Cancel', cls: 'btn-outline' }, { label: 'Save', cls: 'btn-sapphire', onClick: ({ el }) => { const fm = $('form', el); if (!UI.validate(fm)) return false; const c = { id: nextId('customer', 'C-', 3), name: fm.name.value, country: fm.country.value, email: fm.email.value, whatsapp: fm.whatsapp.value, passport: fm.passport.value, consent: fm.consent.checked, consentAt: fm.consent.checked ? new Date().toISOString() : null, unsubscribed: false, createdAt: new Date().toISOString(), notes: '' }; S.customers.push(c); Log.add('Customer added', c.name); Store.save(); toast('Customer added', c.name, 'success'); render(); } }] });
  render();
})();
</script>
</body>
</html>
