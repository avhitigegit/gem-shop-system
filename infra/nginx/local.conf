# Local Nginx: one address for everything – http://localhost:8100
#   /api, /swagger-ui, /v3/api-docs  -> backend (Spring Boot)
#   /prototype/                      -> the approved prototype (to compare screens)
#   everything else                  -> frontend (Next.js)

upstream backend  { server server:8081; }
upstream frontend { server client:3000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;
    server_tokens off;                 # do not show the Nginx version
    # HTTPS servers (UAT / production, P6-02) also send Strict-Transport-Security.

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host:8100;

    location /api/          { proxy_pass http://backend; }
    location /v3/api-docs   { proxy_pass http://backend; }
    location /swagger-ui    { proxy_pass http://backend; }

    location = /prototype { return 301 /prototype/index.html; }
    location /prototype/ {
        alias /usr/share/nginx/prototype/;
        index index.html;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
