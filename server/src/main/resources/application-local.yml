# Your own computer (Docker Compose, or ./mvnw spring-boot:run with npm run dev). Sample data allowed.
# Port 8081 locally (8080 is often taken by other projects on this computer).
server:
  port: ${PORT:8081}
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:gemshop}
app:
  sample-data:
    enabled: ${SAMPLE_DATA:true}  # prototype demo data when the database is empty
    password: ${SAMPLE_PASSWORD:Gem@2026}   # password of the 4 sample logins on your own computer
  auth:
    jwt-secret: ${JWT_SECRET:local-only-secret-change-me-0123456789abcdef}
    cookie-secure: ${COOKIE_SECURE:false}   # http://localhost has no HTTPS
    demo-logins: true
logging:
  level:
    lk.nuvi.gemshop: DEBUG
