# Settings shared by every environment. Environment files: application-{local,dev,uat,prod}.yml
# Secrets always come from environment variables - never commit them.
spring:
  application:
    name: gemshop-server
  profiles:
    default: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gemshop}
    username: ${DB_USER:gemshop}
    password: ${DB_PASSWORD:gemshop}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # tables come only from Flyway migrations
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

app:
  name: Gem Shop System
  environment: ${APP_ENV:local}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  paths-to-match: /api/**
