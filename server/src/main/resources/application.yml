# Settings shared by every environment. Environment files: application-{local,dev,uat,prod}.yml
# Secrets always come from environment variables - never commit them.
spring:
  application:
    name: gemshop-server
  profiles:
    default: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gemshop}
    username: ${DB_USER:gemshop}
    password: ${DB_PASSWORD:gemshop}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # tables come only from Flyway migrations
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 100   # reports read many sales with their items / payments – load them in groups
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

app:
  name: Gem Shop System
  environment: ${APP_ENV:local}
  limits:
    enabled: true                   # per-address limit on sign in, reset password, setup and public links (RequestLimits)
  timezone: Asia/Colombo          # business day (opening cash, close the day, birthdays) is Sri Lanka time
  sample-data:
    enabled: false                # switched on in local / dev / uat only
  auth:
    jwt-secret: ${JWT_SECRET:}      # required on servers: at least 32 random characters
    access-minutes: 10              # login token; renewed while the person works
    idle-minutes: 15                # signed out after 15 minutes without use (shared shop computers)
    session-hours: 12               # longest sign-in without "Keep me signed in"
    remember-days: 30               # "Keep me signed in on this device"
    max-failed-logins: 5            # wrong passwords before the login is locked
    lock-minutes: 15
    reset-link-minutes: 30          # "forgot password" link: 30 minutes, one use (prototype screen)
    app-url: ${APP_URL:http://localhost:8100}
    cookie-secure: ${COOKIE_SECURE:true}
    demo-logins: false              # "Demo: sign in as…" buttons – local / dev only
  mail:
    from: ${MAIL_FROM:Gem Shop System <no-reply@localhost>}   # used until Shop details has an email
    use-settings: ${MAIL_USE_SETTINGS:false}  # false = every email goes to the test mail server above (MailHog); true (P6-03) = the SMTP saved on Email & WhatsApp settings
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  crypto:
    key: ${ENCRYPTION_KEY:}         # required: 32+ random characters. KEEP A SAFE COPY – without it passport / phone / email cannot be read again
  files:
    dir: ${FILES_DIR:./data/files}  # photos, bill photos, certificate scans (Docker volume on servers; nightly copy to S3)
    link-minutes: 60                # private download links stop working after this
    keep-unattached-hours: 24       # uploads never saved with a record are removed after this
  whatsapp:                         # messages coming in (a customer replies STOP) – connected in P6-03
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}   # the word typed in the Meta app for the webhook; empty = webhook off
    app-secret: ${WHATSAPP_APP_SECRET:}       # Meta app secret: checks the signature of every call; empty = webhook off

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  paths-to-match: /api/**
