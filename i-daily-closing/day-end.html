<!-- Screen: Day-end closing (counted vs expected, difference highlighted) | BRD: I3, I4, I1, I2, M4, G2 | Rules: 9, 10 | Roles: Owner, Salesperson -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day-end Closing · Gem Shop</title>
<link rel="icon" href="../assets/img/logo.svg"><link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-root="../" data-page="i-daily-closing/day-end.html" data-roles="owner salesperson">
<div id="page"></div>
<script src="../assets/js/data.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/layout.js"></script>
<script>
if (PAGE_ALLOWED) (function () {
  const br = activeBranch(), d = todayYmd();
  function render() {
    const exp = Calc.expectedCash(S, d, br);
    const done = S.closings.find(c => c.date === d && c.branch === br);
    const sales = Metrics.salesOn(d, br);
    const cnt = done ? done.counted : { LKR: '', USD: '', EUR: '' };
    $('#page').innerHTML = UI.pageHead({ crumbs: 'I · Daily cash closing', title: 'Day-end closing – ' + fmt.date(d), brd: ['I3', 'I4'], sub: esc(branchName(br)) + ' · count the cash in each currency and enter the card machine total. The system shows what should be there and any difference.' }) +
      `${!S.openings[d + '|' + br] ? '<div class="alert warning mb">Opening cash was not entered today. <a href="opening-cash.html">Enter it first →</a></div>' : ''}
      ${done ? `<div class="alert success mb">✓ Day closed at ${fmt.time(done.at)} by ${esc(user(done.by).name)}. The closing report was sent to the owner automatically (I4).</div>` : ''}
      <div class="grid g-2-1"><form class="card" id="f" novalidate><div class="card-header"><h3>Count the drawer</h3></div>
      <div class="card-content"><table class="table"><thead><tr><th></th><th class="num">Opening</th><th class="num">+ Cash sales</th><th class="num">Expected</th><th class="num">Counted</th><th class="num">Difference</th></tr></thead><tbody>
        ${['LKR', 'USD', 'EUR'].map(c => `<tr><td><b>${c} cash</b></td><td class="num">${fmt.num(exp.opening[c] || 0)}</td><td class="num">${fmt.num(exp.cash[c] - (exp.opening[c] || 0))}</td><td class="num"><b>${fmt.num(exp.cash[c])}</b></td><td class="num"><input class="input right" style="width:130px" type="number" step="0.01" min="0" required name="${c}" value="${cnt[c]}" ${done ? 'readonly' : ''}></td><td class="num" data-diff="${c}">–</td></tr>`).join('')}
        <tr><td><b>Card machine total</b></td><td></td><td></td><td class="num"><b>${fmt.num(exp.card)}</b></td><td class="num"><input class="input right" style="width:130px" type="number" step="0.01" min="0" required name="card" value="${done ? done.cardCounted : ''}" ${done ? 'readonly' : ''}></td><td class="num" data-diff="card">–</td></tr>
      </tbody></table>
      <div class="muted" style="font-size:12px">LKR expected already deducts change given (${fmt.lkr(sum(sales, s => s.change || 0))}) and drawer payouts (${fmt.lkr(exp.drawerOut)}) – <a href="drawer-expenses.html">see drawer expenses</a>.</div>
      <div id="diffBox" class="mt"></div>
      <div class="field mt"><label>Note for the owner</label><textarea name="note" ${done ? 'readonly' : ''} placeholder="Explain any difference…">${done ? esc(done.note) : ''}</textarea></div></div>
      <div class="card-footer">${done ? `<a class="btn btn-outline" href="../l-reports/daily-closing.html">Closing report</a>` : '<button class="btn btn-outline" type="button" id="fill">Demo: fill expected</button><button class="btn btn-success" type="submit">Close the day &amp; send to owner</button>'}</div></form>
      <div class="stack"><div class="card"><div class="card-header"><h3>Today in numbers</h3></div><div class="card-content"><dl class="dl" style="grid-template-columns:1fr auto">
        <dt>Bills</dt><dd class="right">${sales.length}</dd><dt>Sales total</dt><dd class="right">${fmt.lkr(sum(sales, s => s.total))}</dd><dt>Cash sales (in LKR)</dt><dd class="right">${fmt.lkr(exp.cashSalesLKR)}</dd><dt>Card sales</dt><dd class="right">${fmt.lkr(exp.card)}</dd><dt>Drawer payouts</dt><dd class="right">${fmt.lkr(exp.drawerOut)}</dd></dl></div></div>
        <div class="card"><div class="card-header"><h3>Payments today</h3></div>${UI.table([{ h: 'Invoice', f: s => `<a class="mono" href="../g-payments/invoice.html?id=${s.id}">${s.id.slice(-6)}</a>` }, { h: 'Paid', f: s => s.payments.map(p => p.method === 'card' ? 'Card' : p.currency + ' ' + fmt.num(p.amount, 0)).join(' + ') }, { h: 'Change', num: 1, f: s => fmt.num(s.change || 0, 0) }], sales, { empty: 'No sales today.' })}</div></div></div>`;
    const F = $('#f');
    function diffs() {
      let tot = 0, any = false;
      ['LKR', 'USD', 'EUR', 'card'].forEach(c => {
        const v = F[c].value; const e = c === 'card' ? exp.card : exp.cash[c]; const cell = $(`[data-diff="${c}"]`);
        if (v === '') { cell.innerHTML = '–'; return; }
        any = true; const df = r2(+v - e); tot += c === 'card' || c === 'LKR' ? df : fx.toLKR(df, c);
        cell.innerHTML = Math.abs(df) < 0.005 ? '<span class="badge badge-success">0.00 ✓</span>' : `<span class="badge ${df < 0 ? 'badge-danger' : 'badge-warning'}">${df > 0 ? '+' : ''}${fmt.num(df)}</span>`;
      });
      $('#diffBox').innerHTML = any ? (Math.abs(tot) < 0.5 ? '<div class="alert success"><b>Balanced.</b> Counted cash matches the expected amounts.</div>' : `<div class="alert danger"><b>Difference: ${tot > 0 ? '+' : ''}${fmt.lkr(tot)}</b> (all currencies converted at today's rates). The difference is highlighted in the owner's report.</div>`) : '';
      return tot;
    }
    F.addEventListener('input', diffs); diffs();
    const fill = $('#fill'); if (fill) fill.onclick = () => { F.LKR.value = exp.cash.LKR; F.USD.value = exp.cash.USD; F.EUR.value = exp.cash.EUR; F.card.value = exp.card; diffs(); };
    F.onsubmit = e => {
      e.preventDefault(); if (!UI.validate(F)) return;
      const tot = diffs();
      if (Math.abs(tot) >= 0.5 && F.note.value.trim().length < 3) { F.note.closest('.field').classList.add('invalid'); toast('Please explain the difference', 'Add a note for the owner.', 'error'); return; }
      const c = { id: 'DC-' + d.replace(/-/g, '') + (br === 'ella' ? '' : '-B2'), date: d, branch: br, expected: exp.cash, counted: { LKR: +F.LKR.value, USD: +F.USD.value, EUR: +F.EUR.value }, cardExpected: exp.card, cardCounted: +F.card.value, by: currentUser().id, at: new Date().toISOString(), sentToOwner: true, note: F.note.value.trim() };
      S.closings.push(c);
      Log.add('Day closed', c.id + ' · difference ' + fmt.lkr(tot));
      Alerts.add('closing', 'Day closing ' + fmt.date(d) + ' · ' + esc(branchName(br)) + (Math.abs(tot) >= 0.5 ? ' · DIFFERENCE ' + fmt.lkr(tot) : ' · balanced'), 'l-reports/daily-closing.html');
      Store.save(); toast('Day closed', 'Closing report sent to the owner (I4).', 'success'); render();
    };
  }
  render();
})();
</script>
</body>
</html>
